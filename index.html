<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          var fetchDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!fetchDesc) {
            var p = Object.getPrototypeOf(window);
            while (p && !fetchDesc) {
              fetchDesc = Object.getOwnPropertyDescriptor(p, 'fetch');
              p = Object.getPrototypeOf(p);
            }
          }
          if (fetchDesc && (!fetchDesc.set || !fetchDesc.writable)) {
            var activeFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return activeFetch;
              },
              set: function (fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Ignore
        }

        window.addEventListener('error', function (e) {
          if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
